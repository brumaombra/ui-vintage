name: Test and publish npm package

on:
  # Test and publish when a version tag is pushed, for example v0.1.3
  push:
    tags:
      - 'v*'

  # Test, publish, and tag the version in package.json when started by hand (Actions > Run workflow, on the branch to release)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Read-only access is enough to check out and test the code
    permissions:
      contents: read

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v5

      # Setup Node.js (the demo app needs 24.21+)
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-app/package-lock.json

      # Install the library dependencies from the lockfile
      - name: Install library dependencies
        run: npm ci

      # Install the demo app, which hosts the tests and consumes the library through file:..
      - name: Install demo app dependencies
        run: npm ci --prefix demo-app

      # Validate the types of the published source runtime package
      - name: Type-check package
        run: npm run typecheck

      # Ensure the shipped component catalog matches the source
      - name: Check component catalog
        run: npm run docs:components:check

      # Run the unit tests and the component tests mounted in the demo Nuxt app
      - name: Run tests
        run: npm test

  publish:
    # Publish only after the tests pass
    needs: test
    runs-on: ubuntu-latest

    # Grant the permissions needed to mint an OIDC token for npm trusted publishing, push the version tag of a manual run, and create a GitHub Release
    permissions:
      contents: write
      id-token: write

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Install dependencies so the package is published from a clean environment
      - name: Install dependencies
        run: npm ci

      # Resolve the release tag: the pushed tag, or the package.json version for a manual run
      - name: Resolve release tag
        id: release
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$PACKAGE_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # Ensure the pushed tag matches the version declared in package.json
      - name: Validate tag version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.release.outputs.version }}" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version (${{ steps.release.outputs.version }})."
            exit 1
          fi

      # Ensure a manual run releases a new version (no existing tag, not on npm yet)
      - name: Check the version is new
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists: bump the version in package.json first."
            exit 1
          fi
          if npm view "@brumaombra/ui-vintage@${{ steps.release.outputs.version }}" version > /dev/null 2>&1; then
            echo "Version ${{ steps.release.outputs.version }} is already on npm: bump the version in package.json first."
            exit 1
          fi

      # Inspect the published tarball contents without building dist output
      - name: Inspect package contents
        run: npm pack --dry-run

      # Publish to npm through trusted publishing using the GitHub OIDC identity
      - name: Publish to npm
        run: npm publish --access public --provenance

      # Tag the released commit for a manual run, only once the package is published (a failed publish leaves no tag behind)
      - name: Push version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" -m "${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.tag }}"

      # Create a GitHub Release for the same tag with generated release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
