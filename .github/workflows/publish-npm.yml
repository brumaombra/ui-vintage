name: Test and publish npm package

on:
  # Test and publish when a version tag is pushed, for example v0.1.3
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    # Read-only access is enough to check out and test the code
    permissions:
      contents: read

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v5

      # Setup Node.js (the demo app needs 22.19+ for the built-in node:sqlite module)
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-app/package-lock.json

      # Install the library dependencies from the lockfile
      - name: Install library dependencies
        run: npm ci

      # Install the demo app, which hosts the tests and consumes the library through file:..
      - name: Install demo app dependencies
        run: npm ci --prefix demo-app

      # Validate the types of the published source runtime package
      - name: Type-check package
        run: npm run typecheck

      # Ensure the shipped component catalog matches the source
      - name: Check component catalog
        run: npm run docs:components:check

      # Run the unit tests and the component tests mounted in the demo Nuxt app
      - name: Run tests
        run: npm test

  publish:
    # Publish only after the tests pass
    needs: test
    runs-on: ubuntu-latest

    # Grant the permissions needed to mint an OIDC token for npm trusted publishing and create a GitHub Release from the pushed version tag
    permissions:
      contents: write
      id-token: write

    steps:
      # Check out the repository
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Install dependencies so the package is published from a clean environment
      - name: Install dependencies
        run: npm ci

      # Ensure the pushed tag matches the version declared in package.json
      - name: Validate tag version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      # Inspect the published tarball contents without building dist output
      - name: Inspect package contents
        run: npm pack --dry-run

      # Publish to npm through trusted publishing using the GitHub OIDC identity
      - name: Publish to npm
        run: npm publish --access public --provenance

      # Create a GitHub Release for the same tag with generated release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
